project:
  name: "payment-service"
  src_root: "src"
  exclude: ["tests/**", "vendor/**"]
layers:
  - { name: "Domain", namespaces: ["App\\Domain\\*"], paths: ["src/Domain/"] }
  - { name: "Application", namespaces: ["App\\Application\\*"], paths: ["src/Application/"] }
  - { name: "Infrastructure", namespaces: ["App\\Infrastructure\\*"], paths: ["src/Infrastructure/"] }
rules:
  - { from: "Domain", to: "Application", allow: false, description: "Domain must not depend on Application" }
  - { from: "Domain", to: "Infrastructure", allow: false, description: "Domain must not depend on Infrastructure" }
  - { from: "Application", to: "Domain", allow: true, description: "Application uses domain entities" }
  - { from: "Application", to: "Infrastructure", allow: false, description: "Application must not depend on Infrastructure" }
  - { from: "Infrastructure", to: "Domain", allow: true, description: "Infrastructure implements domain interfaces" }
external:
  - system: notion
    command: ["npx", "-y", "@notionhq/notion-mcp-server"]
    env:
      OPENAPI_MCP_HEADERS: '{"Authorization": "Bearer ${NOTION_API_TOKEN}", "Notion-Version": "2022-06-28"}'
    search_tool: "API-post-search"
    search_arg: "query"
  - system: jira
    command: ["uvx", "mcp-atlassian"]
    env:
      JIRA_URL: "${JIRA_URL}"
      JIRA_USERNAME: "${JIRA_USERNAME}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
      JIRA_PROJECTS_FILTER: "${JIRA_PROJECT_KEY}"
    search_tool: "jira_search"
    search_arg: "jql"
    query_template: 'text ~ "%s"'
    default_query: "audit transactions payment"
  - system: youtrack
    command: ["npx", "-y", "@vitalyostanin/youtrack-mcp"]
    env:
      YOUTRACK_URL: "${YOUTRACK_URL}"
      YOUTRACK_TOKEN: "${YOUTRACK_TOKEN}"
    search_tool: "issues_search"
    search_arg: "query"
    default_query: "transaction"

domain_context:
  domain: "FinTech"
  description: "Payment processing system with audit and data isolation requirements."
  domain_rules:
    - { id: "fintech_audit_trail", description: "Financial transactions must have audit trail", severity: "critical" }
    - { id: "fintech_data_isolation", description: "Payment data must not appear in logs", severity: "critical" }
    - { id: "fintech_transaction_integrity", description: "Balance changes must be in DB transaction", severity: "high" }

# Optional runtime tuning. Omit the section to use the "auto" profile defaults.
# Profiles encode per-tier policy: aggressive (paid headroom, short retry budget),
# auto (typical dev key, prompt-cache + preemptive sleep on), conservative (free/demo tier).
# Field-level entries override their profile preset.
#
# runtime:
#   profile: auto                       # auto | conservative | aggressive
#   max_file_bytes: 65536               # read_file soft cap; over this, truncate with line-range hint
#   prune_after_turns: 10               # start eliding old tool_result blocks after N assistant turns
#   keep_recent_turns: 4                # never prune the last N turns
#   provider_max_retries: 5             # httpclient retry budget on 429 / 529
#   provider_retry_wait: 20s            # base for exponential+jitter backoff (Retry-After takes priority)
#   anthropic_cache_tail: true          # ephemeral cache marker on tail tool_result (turn ≥ 2)
#   respect_rate_limit_headers: true    # preemptive sleep when x-ratelimit-* signals near-empty bucket
